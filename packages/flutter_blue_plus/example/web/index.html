<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_blue_plus_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_blue_plus_example</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      function showError(text) {
        var box = document.getElementById('debug-errors');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'debug-errors';
          box.style.cssText =
            'position:fixed;inset:0;z-index:2147483647;overflow:auto;' +
            'margin:0;padding:12px;background:#fff;color:#b00020;' +
            'font:14px monospace;white-space:pre-wrap;';
          document.body.appendChild(box);
        }
        box.textContent += text + '\n\n';
      }

      window.addEventListener('error', function (e) {
        showError('JS/resource error: ' +
          (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown') +
          (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        showError('Promise rejection: ' + String(e.reason));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
